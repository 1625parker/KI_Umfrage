<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline Umfrage V5</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Wo verorte ich mich selbst, wo die Gesellschaft?</h1>
<div class="controls">
<label>Linker Pol <input id="leftLabel" value="KI ist Risiko"></label>
<label>Rechter Pol <input id="rightLabel" value="KI ist Chance"></label>
</div>
<div class="inputBox">
<h2>Antwort erfassen</h2>
<label>Ich <input id="selfSlider" type="range" min="1" max="100" value="50"></label>
<span id="selfValue">50</span><br>
<label>Gesellschaft <input id="societySlider" type="range" min="1" max="100" value="50"></label>
<span id="societyValue">50</span><br>
<button id="addButton">Antwort hinzufügen</button>
<button id="clearButton">Alle Antworten löschen</button>
<button id="csvButton">CSV exportieren</button>
</div>
<div id="answerCount">0 Antworten</div>
<canvas id="chart" width="1400" height="700"></canvas>
<h2>Antworten</h2>
<table>
<thead><tr><th>ID</th><th>Ich</th><th>Gesellschaft</th><th>Aktion</th></tr></thead>
<tbody id="answerTable"></tbody>
</table>
<script src="app.js"></script>
</body>
</html>
